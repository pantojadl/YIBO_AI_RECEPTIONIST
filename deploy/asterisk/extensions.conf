; YIBO inbound-only dialplan. No outbound trunk. No recording.

[general]
static=yes
writeprotect=yes

[globals]
YIBO_ARI_APP=yibo
YIBO_LAB_DID=__YIBO_LAB_DID__

[yibo-inbound]
; Carrier ingress. The called number is the DID argument to Stasis.
exten => _+1NXXNXXXXXX,1,NoOp(YIBO inbound ${EXTEN})
 same => n,Set(CHANNEL(language)=en)
 same => n,Answer()
 same => n,Stasis(${YIBO_ARI_APP},${EXTEN})
 same => n,Hangup()

exten => _1NXXNXXXXXX,1,Goto(yibo-inbound,+${EXTEN},1)

; Unknown or ambiguous called numbers never reach Stasis or the model.
exten => _X.,1,NoOp(Rejected unknown called number ${EXTEN})
 same => n,Hangup()

exten => s,1,NoOp(Rejected unknown called number ${EXTEN})
 same => n,Hangup()

[yibo-internal]
; Lab phones only. They are not reachable from the carrier context.
exten => 600,1,NoOp(Internal echo)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 700,1,NoOp(Simulated inbound to the lab DID)
 same => n,Goto(yibo-inbound,${YIBO_LAB_DID},1)

exten => _2XX,1,NoOp(Internal extension)
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

[yibo-outbound-transfer]
; Human transfer to a phone number lands here and stops.
; Do not dial the carrier from this context.
exten => _X.,1,NoOp(Outbound transfer blocked ${EXTEN})
 same => n,Hangup()

[yibo-outbound-disabled]
exten => _X.,1,Hangup()
