; YIBO inbound-only PJSIP template for Asterisk 22 LTS.
; Render with: pnpm asterisk:render
; Do not commit rendered files. The carrier endpoint cannot place calls.

[global]
type=global
user_agent=YIBO
keep_alive_interval=90

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12
external_signaling_address=__YIBO_PUBLIC_IP__
external_media_address=__YIBO_PUBLIC_IP__

; Disabled until a purchased trunk exists. match is TEST-NET-3 (RFC 5737), not a carrier.
[carrier-disabled]
type=endpoint
context=yibo-inbound
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
transport=transport-udp
aors=carrier-disabled

[carrier-disabled]
type=aor
contact=sip:disabled.invalid

[carrier-disabled]
type=identify
endpoint=carrier-disabled
match=203.0.113.10

[test-alice]
type=endpoint
context=yibo-internal
disallow=all
allow=ulaw
auth=test-alice
aors=test-alice
transport=transport-udp

[test-alice]
type=auth
auth_type=userpass
username=alice
password=__YIBO_TEST_EXTENSION_PASSWORD__

[test-alice]
type=aor
max_contacts=1

[test-bob]
type=endpoint
context=yibo-internal
disallow=all
allow=ulaw
auth=test-bob
aors=test-bob
transport=transport-udp

[test-bob]
type=auth
auth_type=userpass
username=bob
password=__YIBO_TEST_EXTENSION_PASSWORD__

[test-bob]
type=aor
max_contacts=1
